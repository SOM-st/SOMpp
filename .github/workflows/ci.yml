name: Tests

on: [push, pull_request]

jobs:
  test_soms:
    name: Run (Compiler=${{matrix.compiler}} GC=${{matrix.gc}} ${{matrix.cmake_flags}}
    runs-on: ubuntu-24.04
    # continue-on-error: true
    strategy:
      fail-fast: false # we want all jobs to run, because they may fail independently
      matrix:
        compiler: [clang, gcc]
        gc: [GENERATIONAL, MARK_SWEEP, COPYING]
        cmake_flags:
          - "-DUSE_TAGGING=true"
          - "-DUSE_TAGGING=false -DCACHE_INTEGER=true"
          - "-DUSE_TAGGING=false -DCACHE_INTEGER=false -DUSE_VECTOR_PRIMITIVES=false"

    steps:
      - name: Checkout SOM Repository
        uses: actions/checkout@v6

      - name: Install Apt Packages
        run: |
          sudo apt-get install libcppunit-dev

      - name: Install Clang 22
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install -y clang-22 clang-tidy-22 && break
            sleep 17
          done
        if: matrix.compiler == 'clang'

      - name: Install Clang Format
        run: sudo apt-get install -y clang-format-22
        if: matrix.compiler == 'clang' && matrix.gc == 'GENERATIONAL'

      - name: Build SOM VM
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]
          then
            export CC=clang-22
            export CXX=clang++-22
          else
            export CC=gcc
            export CXX=g++
          fi
          echo $CC $CXX
          mkdir cmake-build
          cd cmake-build
          echo cmake .. -DGC_TYPE=${{ matrix.gc}} ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Debug
          cmake .. -DGC_TYPE=${{ matrix.gc}} ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Debug
          make -j5

      - name: Run Unit Tests
        run: |
          cd cmake-build
          ./unittests -cp ../Smalltalk:../TestSuite/BasicInterpreterTests ../Examples/Hello.som
          ./SOM++ -prim-hash-check -cp ../Smalltalk ../Examples/Benchmarks/BenchmarkHarness.som VectorBenchmark 1 1

      - name: Run Tests on SOM VM
        run: |
          cd cmake-build
          ./SOM++ -cp ../Smalltalk ../TestSuite/TestHarness.som

      - name: Integration Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          export VM=./cmake-build/SOM++
          export CLASSPATH=Smalltalk
          export AWFY=core-lib/Examples/AreWeFastYet/Core
          export TEST_EXPECTATIONS=./integration-tests.yml
          pytest core-lib/IntegrationTests

      - name: Clang Tidy
        if: matrix.compiler == 'clang'
        run: |
          cd cmake-build
          make check-tidy

      - name: Clang Format
        if: matrix.compiler == 'clang' && matrix.gc == 'GENERATIONAL'
        run: |
          cd cmake-build
          make check-format

      # Disabled because it's too slow with the sanitizers
      # - name: Test SomSom
      #   run: |
      #     export ASAN_OPTIONS=detect_leaks=0
      #     cmake-build/SOM++ -cp Smalltalk:TestSuite:core-lib/SomSom/src/compiler:core-lib/SomSom/src/interpreter:core-lib/SomSom/src/primitives:core-lib/SomSom/src/vm:core-lib/SomSom/src/vmobjects core-lib/SomSom/tests/SomSomTests.som

  build_all_debugging_variants:
    name: Build All Debugging Variants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SOM Repository
        uses: actions/checkout@v6

      - name: Try building all variants
        run: |
          build_options=(
              "BYTECODE_HEATMAP"
              "GENERATE_ALLOCATION_STATISTICS"
              "LOG_RECEIVER_TYPES"
              "UNSAFE_FRAME_OPTIMIZATION"
              "ADDITIONAL_ALLOCATION"
          )

          for opt in "${build_options[@]}"; do
              echo "Processing: $opt"
              mkdir cmake-build && cd cmake-build
              echo cmake .. -D$opt=true
              cmake .. -D$opt=true
              make -j5
              cd ..
              rm -Rf cmake-build
          done
